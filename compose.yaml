services:
  api:
    image: chaitanya-portfolio-api:latest
    build:
      context: .
      target: api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: chaitanya-portfolio-frontend:latest
    build:
      context: .
      target: frontend
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      API_HOST: api
      API_PORT: 8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

